      tags:
        - 'Measure Management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: 'The ID of the user.'
                  example: 4
                  nullable: false
                stature:
                  type: numeric
                  description: 'The stature of the user.'
                  example: minus
                  nullable: false
                shoulder_circumference:
                  type: numeric
                  description: 'The shoulder circumference.'
                  example: eum
                  nullable: false
                chest_circumference:
                  type: numeric
                  description: 'The chest circumference.'
                  example: ad
                  nullable: false
                waist_circumference:
                  type: numeric
                  description: 'The waist circumference.'
                  example: eos
                  nullable: false
                hip_circumference:
                  type: numeric
                  description: 'The hip circumference.'
                  example: iusto
                  nullable: false
                shoulder_height:
                  type: numeric
                  description: 'The shoulder height.'
                  example: quam
                  nullable: false
                hip_height:
                  type: numeric
                  description: 'The hip height.'
                  example: eius
                  nullable: false
                knee_height:
                  type: numeric
                  description: 'The knee height.'
                  example: facilis
                  nullable: false
                chest_spacing:
                  type: numeric
                  description: 'The chest spacing.'
                  example: tempore
                  nullable: false
                breast_height:
                  type: numeric
                  description: 'The breast height.'
                  example: ut
                  nullable: false
                pelvis_height:
                  type: numeric
                  description: 'The pelvis height.'
                  example: molestias
                  nullable: false
                front_waist_length:
                  type: numeric
                  description: 'The front waist length.'
                  example: et
                  nullable: false
                shoulder_length:
                  type: numeric
                  description: 'The shoulder length.'
                  example: aliquam
                  nullable: false
                back_waist_length:
                  type: numeric
                  description: 'The back waist length.'
                  example: esse
                  nullable: false
                arm_length:
                  type: numeric
                  description: 'The arm length.'
                  example: id
                  nullable: false
                total_arm_length_bent:
                  type: numeric
                  description: 'The total arm length bent.'
                  example: vitae
                  nullable: false
                wrist_circumference:
                  type: numeric
                  description: 'The wrist circumference.'
                  example: excepturi
                  nullable: false
                ankle_height:
                  type: numeric
                  description: 'The ankle height.'
                  example: aut
                  nullable: false
                seated_height:
                  type: numeric
                  description: 'The seated height.'
                  example: cupiditate
                  nullable: false
                crotch_length:
                  type: numeric
                  description: 'The crotch length.'
                  example: eveniet
                  nullable: false
                date_measure:
                  type: date
                  description: 'The date of the measurement.'
                  example: laboriosam
                  nullable: false
              required:
                - user_id
                - stature
                - shoulder_circumference
                - chest_circumference
                - waist_circumference
                - hip_circumference
                - shoulder_height
                - hip_height
                - knee_height
                - chest_spacing
                - breast_height
                - pelvis_height
                - front_waist_length
                - shoulder_length
                - back_waist_length
                - arm_length
                - total_arm_length_bent
                - wrist_circumference
                - ankle_height
                - seated_height
                - crotch_length
                - date_measure
