  /api/materials:
    get:
      summary: 'List Materials'
      operationId: listMaterials
      description: 'Retrieve a list of all materials.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: Cotton
                  description: 'Soft and breathable fabric.'
                  price_per_square_meter: 10.0
                  color: White
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Cotton
                  description:
                    type: string
                    example: 'Soft and breathable fabric.'
                  price_per_square_meter:
                    type: number
                    example: 10.0
                  color:
                    type: string
                    example: White
      tags:
        - 'Materials Management'
      security: []
    post:
      summary: 'Create a Material'
      operationId: createAMaterial
      description: 'Create a new material with the provided data.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: Cotton
                  description: 'Soft and breathable fabric.'
                  price_per_square_meter: 10.0
                  color: White
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Cotton
                  description:
                    type: string
                    example: 'Soft and breathable fabric.'
                  price_per_square_meter:
                    type: number
                    example: 10.0
                  color:
                    type: string
                    example: White
      tags:
        - 'Materials Management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The name of the material.'
                  example: Cotton
                  nullable: false
                description:
                  type: string
                  description: 'The description of the material.'
                  example: 'Soft and breathable fabric.'
                  nullable: true
                price_per_square_meter:
                  type: number
                  description: 'The price per square meter.'
                  example: 10.0
                  nullable: false
                color:
                  type: string
                  description: 'The color of the material.'
                  example: White
                  nullable: false
              required:
                - name
                - color
      security: []
  '/api/materials/{id}':
