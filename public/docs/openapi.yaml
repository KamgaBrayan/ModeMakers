      security: []
  /api/review:
    get:
      summary: ''
      operationId: getApiReview
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
    post:
      summary: ''
      operationId: postApiReview
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the users table.'
                  example: ea
                  nullable: false
                product_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the products table.'
                  example: qui
                  nullable: false
                comment:
                  type: string
                  description: ''
                  example: omnis
                  nullable: false
              required:
                - user_id
                - product_id
                - comment
      security: []
  '/api/review/{id}':
    get:
      summary: ''
      operationId: getApiReviewId
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
    put:
      summary: ''
      operationId: putApiReviewId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the users table.'
                  example: null
                  nullable: false
                product_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the products table.'
                  example: null
                  nullable: false
                comment:
                  type: string
                  description: ''
                  example: ea
                  nullable: false
      security: []
    delete:
      summary: ''
      operationId: deleteApiReviewId
      description: ''
      parameters: []
      responses: {  }
      tags:
