<div class="overflow-auto p-4">
  <h2 class="text-xl font-semibold mb-4">Personal Information</h2>
  <form (ngSubmit)="onSubmit($event)">
    <!-- Gender -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Gender</label>
      <div class="flex items-center space-x-4">
        <label class="flex items-center">
          <input type="radio" name="gender" [(ngModel)]="formData.gender" value="male" class="form-radio text-blue-600">
          <span class="ml-2">Male</span>
        </label>
        <label class="flex items-center">
          <input type="radio" name="gender" [(ngModel)]="formData.gender" value="female" class="form-radio text-blue-600">
          <span class="ml-2">Female</span>
        </label>
        <label class="flex items-center">
          <input type="radio" name="gender" [(ngModel)]="formData.gender" value="other" class="form-radio text-blue-600">
          <span class="ml-2">Other</span>
        </label>
      </div>
    </div>

    <!-- Location -->
    <div class="mb-4">
      <label for="location" class="block text-sm font-medium text-gray-700 mb-2">Location</label>
      <input 
        type="text" 
        id="location" 
        [(ngModel)]="formData.location"
        placeholder="Enter your location"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
    </div>

    <!-- Specification -->
    <div class="mb-4">
      <label for="specification" class="block text-sm font-medium text-gray-700 mb-2">Specification</label>
      <textarea 
        id="specification" 
        rows="4" 
        [(ngModel)]="formData.specification"
        placeholder="Add any additional details here"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
    </div>

    <!-- Delivery Type -->
    <div class="mb-4">
      <label for="delivery-type" class="block text-sm font-medium text-gray-700 mb-2">
        Delivery Type
        <i>(Choose the type of service)</i>
      </label>
      <select
        id="delivery-type"
        [(ngModel)]="formData.deliveryType"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-700 focus:border-indigo-700"
      >
        <option value="standard">Standard</option>
        <option value="advanced">Advanced</option>
        <option value="express">Express</option>
      </select>
    </div>

    <!-- Choose Measure -->
    <div class="mb-4 w-full">
      <label for="measure" class="block text-sm font-medium text-gray-700 mb-2">
        Choose the measure of the command
        <i>(Choose a measure)</i>
      </label>
      <span class="flex flex-row w-full justify-between">
        <select
        *ngIf="measures.length > 0"
        id="measure"
        class="w-[48%] px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-700 focus:border-indigo-700"
        (change)="onMeasureChange($event)"
      >
        <!-- <option value="" >Select a user</option> -->
        <option value="measures[0].user.user_id"  class="text-gray-700" selected>
          {{ measures[0].user.user_name }} (Default)
        </option>
        <option *ngFor="let measure of measures" [value]="measure.user.user_id">
          {{ measure.user.user_name }}
        </option>
      </select>
      
        <button class="w-[48%] h-[40px] rounded-md bg-white border-indigo-700 border text-indigo-700 flex items-center justify-center transition-all hover:bg-indigo-600 text-sm hover:text-white">
          Take a new measure
        </button>
      </span>
    </div>

    <!-- Submit Button -->
    <div class="text-right">
      <button 
        type="submit" 
        class="px-4 py-2 bg-indigo-700 text-white rounded-md shadow hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-bg-indigo-400">
        Submit
      </button>
    </div>
  </form>
</div>
