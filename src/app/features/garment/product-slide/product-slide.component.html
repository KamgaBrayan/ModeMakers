<div class="relative w-full">
    <div class="w-full h-[900px] p-4 border bg-white shadow-md rounded-lg ">

        <div class="pb-4">
            <h2 class="text-lg md:text-xl font-semibold py-2">Model</h2>
            <div class="flex flex-row items-center justify-between">

                <p class="product-price py-2">{{ product.name }} </p>
                <span class="text-yellow-500">
                    <ng-container *ngFor="let star of getStarsArray()">
                        <span>★</span>
                    </ng-container>
                </span>
            </div>
        </div>

        <div class=" w-full flex flex-row justify-around items-center">
            <button class="arrow left" (click)="previousImage()">&#10094;</button>
            <div class="w-[500px] ">
                <div class="main-image">
                    <img [src]="product.photos[currentImageIndex]" alt="Product Image" />
                </div>

                <div class="thumbnail-container">
                    <img *ngFor="let image of product.photos; let i = index" [src]="image"
                        [class.active]="i === currentImageIndex" (click)="currentImageIndex = i" alt="Thumbnail" />
                </div>
            </div>
            <button class="arrow right" (click)="nextImage()">&#10095;</button>
        </div>
    <div>
        <h1 class="font-bold text-2xl py-4 text-left">Workforce</h1>
    </div>
    <ul>
        <li class="flex flex-row w-full justify-between py-1">
            <p><b>Standard (1mois):</b></p>
            {{product.workforce[0]}} FrancsCFA
        </li>
        <li class="flex flex-row w-full justify-between py-1">
            <p><b>Advanced (2 semaines):</b></p>
            {{product.workforce[1]}} FrancsCFA
        </li>
        <li class="flex flex-row w-full justify-between py-1">
            <p><b>Express (1 semaine):</b></p>
            {{product.workforce[2]}} FrancsCFA
        </li>
    </ul>
</div>

</div>
