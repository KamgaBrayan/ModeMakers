
<body class="bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Mes Commandes</h1>
        <p class="text-sm text-gray-500 mt-1">Gérez et suivez vos commandes en cours</p>
      </div>

    
      
      <div class="flex gap-3 w-full sm:w-auto">
        <div class="relative flex-1 sm:flex-initial">
          <select [(ngModel)]="sortBy" 
          (change)="onSortChange()" class="w-full sm:w-auto appearance-none bg-white border border-gray-300 rounded-lg pl-3 pr-10 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#3734A9] hover:border-gray-400 transition-colors">
            <option value="recent">recent</option>
            <option value="oldest">Oldest</option>
            <option value="price-high">Increasing price</option>
            <option value="price-low">Decreasing price</option>
          </select>
          <div class="pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2">
            <i class="fas fa-chevron-down text-gray-400"></i>
          </div>
        </div>
      </div>
    </div>


    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Card 1 -->
      <div *ngFor="let order of orders | paginate: { itemsPerPage: 12, currentPage: page, totalItems: totalItems }" class="bg-white rounded-xl border border-gray-200 hover:shadow-lg transition-all duration-200 flex flex-col">
        <div class="relative">
          <img [src]="order.payment.preOrder.photos[0]" alt="Service de coiffure" 
               class="w-full h-48 object-cover rounded-t-xl">
        </div>

        <div class="p-4 flex-1">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="text-lg font-semibold text-gray-900">Coupe et Brushing</h3>
              <span class="text-lg  text-gray-900"> WorkForce : {{order.payment.preOrder.workforce}} XAF</span>
              <p class="text-sm text-gray-600 mt-1">Design by: <span class="font-medium text-gray-900">Sarah Coiffure</span></p>

            </div>
            
          </div>
          
          <div class="mt-3 space-y-2">
            <div class="flex items-center text-sm text-gray-500">
              <i class="far fa-calendar mr-2"></i>
             {{order.updatedAt}}
            </div>
            
          </div>
        </div>

        <div class="p-4 bg-gray-50 border-t flex justify-between items-center rounded-b-xl">
          <button (click)="openOrderDetailsModal()" class="text-sm font-medium text-[#3734A9] hover:text-[#2d2b8a] transition-colors">
            <i class="far fa-eye mr-2"></i>
            Détails
          </button>
        </div>
      </div>
      
      <div class="flex justify-center mt-8 ">
        <pagination-controls 
        (pageChange)="page = $event"
        previousLabel="Précédent"
        nextLabel="Suivant">
      </pagination-controls>
      </div>

         
    </div>

    <!-- Modal -->
    <div id="orderDetailsModal" class="fixed inset-0 z-50 overflow-y-auto hidden">
      <div class="flex min-h-screen items-end justify-center px-4 pt-4 pb-20 text-center sm:block sm:p-0">
        <!-- Overlay -->
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>

        <!-- Modal Content -->
        <div class="inline-block transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-4xl">
          <div class="bg-white px-6 pt-6 pb-4">
            <div class="flex justify-between items-start">
              <div>
                <h2 class="text-xl font-bold text-gray-900">Détails de la commande</h2>
                <p class="text-sm text-gray-500 mt-1">Informations complètes de votre commande</p>
              </div>
              
              <button (click)="closeOrderDetailsModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-times text-2xl"></i>
              </button>
            </div>
          </div>
          
          <!-- Modal Body -->
          <div class="px-6 py-6 space-y-6">
            <!-- Details content (can be added as needed) -->
          </div>

          <!-- Modal Footer -->
          <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3">
            <button (click)="closeOrderDetailsModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg transition-colors">
              Fermer
            </button>
           
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script for Modal -->
  <script>
    function openOrderDetailsModal() {
      document.getElementById('orderDetailsModal').classList.remove('hidden');
    }

    function closeOrderDetailsModal() {
      document.getElementById('orderDetailsModal').classList.add('hidden');
    }
  </script>
