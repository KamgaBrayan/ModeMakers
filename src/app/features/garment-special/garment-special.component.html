<app-navbar></app-navbar>
<main class="px-4 md:px-8 lg:px-16">
    <!-- Breadcrumb Section -->
    <div class="py-2">
      <app-breadcrumb-garnment-special></app-breadcrumb-garnment-special>
    </div>
    
    <!-- Stylist Header -->
    <div *ngIf="stylist">
      <h1 class="font-bold text-xl md:text-2xl lg:text-3xl p-4">Stylist: {{ stylist.name }}</h1>
    </div>
  
    <!-- Main Section -->
    <section class="flex flex-col lg:flex-row lg:justify-between gap-4  pb-4">
      <!-- Product Slide Section -->
      <div class="h-[900px] w-full lg:w-[48%]">
        <app-product-slide-special 
          [stylist]="stylist"
          (precommandChange)="handlePrecommandChange($event)"
          >
        </app-product-slide-special>
      </div> 
      
      <!-- Materials and Personal Info Section -->
      <div class="h-[900px] w-full lg:w-[48%] flex flex-col justify-between gap-4">
        <!-- Materials -->
        <div class="overflow-hidden h-full border p-4 bg-white shadow-md rounded-lg">
          <h2 class="text-lg md:text-xl font-semibold py-2">Materials</h2>
          <app-materials
            [materials]="materials"
            (selectedMaterialsChange)="onSelectedMaterialsChange($event)">
          </app-materials>
        </div>
        
        <!-- Personal Information -->
      </div>
    </section> 
  
    <!-- Mensurations and Reviews Section -->
    <div class="flex flex-row justify-between items-center w-full py-4">
        <div class="w-[48%] border bg-white shadow-md rounded-lg">
          <app-personal-info 
            [measures]="measures"
            (formSubmit)="handleFormSubmit($event)">
          </app-personal-info>
          <div class="flex flex-wrap gap-2 mt-4 p-4">
            <p>Stylist Availability : </p>
            <span
              *ngFor="let day of stylist.calendar"
              class="bg-indigo-700 text-white py-1 px-3 rounded-full"
            >
              {{ day }}
            </span>
          </div>
        </div>
        <div class="w-[48%] flex flex-col justify-center pb-4">
          <button  class="w-full h-[60px] rounded-md bg-indigo-700 text-white flex items-center justify-center transition-all hover:bg-indigo-800 text-sm">Send the Craft to the Stylist</button>
          <!-- <div *ngIf="receivedPersonnalInfo || selectedMaterials">
            <h2>Data Received:</h2>
            <p>Stylist : {{ stylist.name }}</p>
            <pre>Personnal info : {{ receivedPersonnalInfo | json }}</pre>
            <pre>Material : {{selectedMaterials | json}}</pre>
            <pre>Precommand : {{precommand | json}}</pre>
          </div>  -->
        </div>
    </div> 

    
  <div class="w-full py-28">
    <app-signup></app-signup>
 </div> 
<div class="w-full flex justify-center"> 
  <div class="w-[60%] py-12">
    <app-user-reviews></app-user-reviews>
  </div>
</div>
 
  </main>
