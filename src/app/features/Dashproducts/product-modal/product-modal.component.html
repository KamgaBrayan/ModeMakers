<div class="modal-overlay" [class.hidden]="!isVisible" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Edit Product</h2>
      <button class="close-btn" (click)="onClose()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="modal-content">
      <!-- Image Upload Section -->
      <div class="image-section">
        <div class="current-image">
          <div *ngIf="!product.images.length" class="upload-placeholder">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span class="mt-2 text-gray-500">No image uploaded</span>
          </div>
          <img *ngIf="product.images.length" [src]="product.images[0]" [alt]="product.name" class="product-image">
          <div class="image-overlay">
            <label class="upload-btn">
              <input type="file" (change)="onImageChange($event)" accept="image/*">
              {{ product.images.length ? 'Change Image' : 'Upload Image' }}
            </label>
          </div>
        </div>
      </div>

      <!-- Form Section -->
      <div class="form-section">
        <div class="form-group">
          <label>Name</label>
          <input type="text" [(ngModel)]="product.name" class="form-input">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Gender</label>
            <select [(ngModel)]="product.gender" class="form-input">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>

          <div class="form-group">
            <label>Age Range</label>
            <input type="text" [(ngModel)]="product.age" class="form-input">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <input type="text" [(ngModel)]="product.category" class="form-input">
          </div>

          <div class="form-group">
            <label>Color</label>
            <input type="text" [(ngModel)]="product.color" class="form-input">
          </div>
        </div>

        <div class="form-group" *ngIf="product?.delivery?.length">
          <label>Delivery Type</label>
          <select [(ngModel)]="selectedDeliveryType" (ngModelChange)="onDeliveryTypeChange($event)" class="form-input">
            <option value="standard">Standard Delivery</option>
            <option value="advanced">Advanced Delivery</option>
            <option value="express">Express Delivery</option>
          </select>
        </div>

        <div class="form-row" *ngIf="product?.delivery?.length">
          <div class="form-group">
            <label>Workforce (XAF)</label>
            <input type="number" [(ngModel)]="currentPrice" class="form-input" readonly>
          </div>
          <div class="form-group">
            <label>Delivery Time (Days)</label>
            <input type="number" [(ngModel)]="currentDays" class="form-input" readonly>
          </div>
        </div>

        <div class="form-group">
          <label>Materials Used</label>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let material of materials" class="px-3 py-1 bg-gray-100 text-gray-800 rounded-full text-sm">
              {{material}}
            </span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Duration</label>
            <input type="text" [(ngModel)]="product.duration" class="form-input">
          </div>

          <div class="form-group">
            <label>Materials</label>
            <div class="materials-list">
              <div class="material-item" *ngFor="let material of product.materials; let i = index">
                <input type="text" [(ngModel)]="material.type" class="form-input">
                <button class="remove-material-btn" (click)="removeMaterial(i)">Remove</button>
              </div>
              <button class="add-material-btn" (click)="addMaterial()">Add Material</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea [(ngModel)]="product.description" rows="3" class="form-input"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" [(ngModel)]="product.availability">
              Available
            </label>
          </div>

          <div class="form-group">
            <label>Rating</label>
            <div class="rating-display">
              <span class="stars">
                <span *ngFor="let star of [1,2,3,4,5]" 
                      [class.filled]="star <= product.note"
                      (click)="product.note = star">★</span>
              </span>
              <span class="rating-value">({{product.meanEvaluation.toFixed(1)}})</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="onClose()">Cancel</button>
      <button class="save-btn" (click)="onSave()">Save Changes</button>
    </div>
  </div>
</div>
